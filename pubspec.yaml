name: iCroMas

description: AI-powered Crop Analyzer

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ============================================================
  # UI & DESIGN
  # ============================================================

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  font_awesome_flutter: ^10.12.0
  lottie: ^3.3.2
  fl_chart: ^1.1.1
  percent_indicator: ^4.2.5
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  syncfusion_flutter_charts: ^30.2.7

  # ============================================================
  # AI / MACHINE LEARNING
  # ============================================================

  # ONNX is not TFLite.
  # Keep this only if another part of your app uses ONNX models.
  flutter_onnxruntime: ^1.8.1
  google_generative_ai: ^0.4.7

  # ============================================================
  # FIREBASE
  # ============================================================

  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10
  firebase_analytics: ^11.6.0
  firebase_database: ^11.1.4

  # ============================================================
  # TESTING / FIREBASE MOCKS
  # ============================================================

  firebase_auth_mocks: ^0.14.2
  fake_cloud_firestore: ^3.0.0

  # ============================================================
  # AUTHENTICATION
  # ============================================================

  google_sign_in: 6.3.0
  flutter_facebook_auth: ^7.2.0

  # ============================================================
  # STATE MANAGEMENT
  # ============================================================

  provider: ^6.1.5
  get: ^4.6.6

  # ============================================================
  # NAVIGATION
  # ============================================================

  go_router: ^16.3.0

  # ============================================================
  # NETWORKING
  # ============================================================

  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  http: ^1.5.0
  http_parser: ^4.1.2
  internet_connection_checker_plus: ^2.9.1

  # ============================================================
  # DEVICE & PERMISSIONS
  # ============================================================

  connectivity_plus: ^7.0.0
  package_info_plus: ^9.0.1
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.4.0
  device_info_plus: ^11.5.0

  # ============================================================
  # STORAGE
  # ============================================================

  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.6
  sqflite: ^2.3.0

  # ============================================================
  # SECURITY
  # ============================================================

  local_auth: 2.3.0

  # ============================================================
  # CAMERA & IMAGE PROCESSING
  # ============================================================

  camera: ^0.11.4
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  flutter_image_compress: ^2.4.0
  image: ^4.8.0

  # ============================================================
  # NOTIFICATIONS
  # ============================================================

  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  # ============================================================
  # PDF
  # ============================================================

  pdf: ^3.12.0
  printing: ^5.14.3
  syncfusion_flutter_pdfviewer: ^30.2.7

  # ============================================================
  # FILE MANAGEMENT
  # ============================================================

  share_plus: ^12.0.2
  open_filex: ^4.7.0
  file_picker: ^8.3.7

  # ============================================================
  # DATE & TIME
  # ============================================================

  intl: ^0.20.2
  timeago: ^3.7.0

  # ============================================================
  # UTILITIES
  # ============================================================

  collection: ^1.18.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.2.1
  mime: ^2.0.0

  # ============================================================
  # DRONE CONTROL
  # ============================================================

  flutter_blue_plus: ^1.36.8
  network_info_plus: ^6.1.4
  udp: ^5.0.3
  video_player: ^2.13.0
  flutter_joystick: ^0.1.0
  sensors_plus: ^6.1.2

  # ============================================================
  # MAPS
  # ============================================================

  flutter_map: ^6.2.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

  # App icon generator
  flutter_launcher_icons: ^0.14.2

  # Native splash-screen generator
  flutter_native_splash: ^2.4.7

# ==============================================================
# FLUTTER CONFIGURATION
# ==============================================================

flutter:
  uses-material-design: true

  # ============================================================
  # APPLICATION ASSETS
  # ============================================================

  assets:
    - assets/images/
    - assets/images/crops/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/
    - assets/labels/
    - .env

  # ============================================================
  # FONTS
  # ============================================================

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400

        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500

        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# ==============================================================
# FLUTTER LAUNCHER ICONS
# ==============================================================

flutter_launcher_icons:
  android: true
  ios: true

  # The iCroMas application icon
  image_path: "assets/icons/icon.png"

  # Android minimum SDK
  min_sdk_android: 21

  # Prevents transparency-related problems on iOS
  remove_alpha_ios: true

# ==============================================================
# FLUTTER NATIVE SPLASH
# ==============================================================

flutter_native_splash:
  color: "#1A7F64"
  image: "assets/icons/icon.png"

  android: true
  ios: true

  android_12:
    color: "#1A7F64"
    image: "assets/icons/icon.png"